<div class="bg-white rounded-2xl p-4 shadow-sm">
    <h2 class="text-lg font-semibold text-green-900 mb-3">
        Track Your Delivery
    </h2>

    <div id="delivery-map"
         style="height: 400px; width: 100%;"
         class="rounded-xl">
    </div>

    <p id="driver-location-status"
       class="text-sm text-zinc-500 mt-3">
        Waiting for delivery partner's location...
    </p>
</div>

<script>
const customerLocation = {
    lat: Number("{{ order.shipping_address.lat }}"),
    lng: Number("{{ order.shipping_address.lng }}")
};

const orderLocationUrl = "{% url 'GetDeliveryLocation' order.id %}";

// Initialize map
const deliveryMap = L.map('delivery-map').setView(
    [customerLocation.lat, customerLocation.lng],
    14
);

// CARTO map tiles
L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key={{ carto_api_key|urlencode }}',
    {
        attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, ' +
            '&copy; <a href="https://carto.com/attributions">CARTO</a>',

        subdomains: 'abcd',
        maxZoom: 20,
        minZoom: 0
    }
).addTo(deliveryMap);

// Customer marker
const customerMarker = L.marker([
    customerLocation.lat,
    customerLocation.lng
]).addTo(deliveryMap);

customerMarker.bindPopup("Your Delivery Address");

// Driver marker
let driverMarker = null;

async function updateDriverLocation() {

    try {

        const response = await fetch(orderLocationUrl);
        const data = await response.json();

        if (!response.ok || !data.success) {
            document.getElementById(
                'driver-location-status'
            ).innerText = data.message || "Driver location unavailable";

            return;
        }

        const latitude = Number(data.location.latitude);
        const longitude = Number(data.location.longitude);

        if (
            !Number.isFinite(latitude) ||
            !Number.isFinite(longitude) ||
            latitude < -90 || latitude > 90 ||
            longitude < -180 || longitude > 180
        ) {
            return;
        }

        const driverPosition = [latitude, longitude];

        if (!driverMarker) {

            driverMarker = L.marker(driverPosition).addTo(deliveryMap);

            driverMarker.bindPopup("Delivery Partner");

            // Show both markers initially
            const bounds = L.latLngBounds([
                [customerLocation.lat, customerLocation.lng],
                driverPosition
            ]);

            deliveryMap.fitBounds(bounds, {
                padding: [40, 40]
            });

        } else {

            // Move existing marker
            driverMarker.setLatLng(driverPosition);
        }

        document.getElementById(
            'driver-location-status'
        ).innerText =
            "Last updated: " +
            new Date(data.location.updated_at).toLocaleTimeString();

    } catch (error) {

        console.error(error);

        document.getElementById(
            'driver-location-status'
        ).innerText = "Unable to fetch driver location.";
    }
}

// Update every 5 seconds
updateDriverLocation();

const locationInterval = setInterval(
    updateDriverLocation,
    5000
);
</script>
