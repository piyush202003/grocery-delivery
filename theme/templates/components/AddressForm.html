{% load static %}

<section class="hidden" id="address-form">
    <!-- Overlay -->
    <div id="address-form-cln-bg" class="fixed inset-0 bg-black/40 z-50"></div>

    <!-- form container -->
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <form method="POST" 
            action="{% if isEdit %}{% url 'AddressEdit' address.id %}{% else %}{% url 'Addresses' %}{% endif %}" 
            class="bg-white rounded-2xl p-6 w-full max-w-lg animate-fade-in">
            {% csrf_token %}

            <!-- Form header -->
            <div class="flex items-center justify-between mb-5">
                <h2 class="text-lg font-semibold text-green-900">
                    
                    {% if isEdit %}
                        Update Address
                    {% else %}
                        Add New Address
                    {% endif %}
                        
                </h2>
                <button type="button" id="cl-address-form-btn" class="p-2 hover:bg-amber-200 rounded-lg">
                    <i data-lucide="x" class="size-5"></i>
                </button>
            </div>

            <!-- Form Input Fields -->
            <div class="space-y-4">
                <div>
                    <label for="{{ form.label.id_for_label }}" class="block text-sm font-medium text-shadow-green-900 mb-1.5">Label</label>
                    {{ form.label }}
                </div>

                <div>
                    <label for="{{ form.address.id_for_label }}" class="block text-sm font-medium text-shadow-green-900 mb-1.5">Street Address</label>
                    {{ form.address }}
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="{{ form.city.id_for_label }}" class="block text-sm font-medium text-shadow-green-900 mb-1.5">City</label>
                        {{ form.city }}
                    </div>
                    <div >
                        <label for="{{ form.state.id_for_label }}" class="block text-sm font-medium text-shadow-green-900 mb-1.5">State</label>
                        {{ form.state }}
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="{{ form.zip.id_for_label }}" class="block text-sm font-medium text-shadow-green-900 mb-1.5">Zip Code</label>
                        {{ form.zip }}
                    </div>
                    <div class="flex items-end pb-1" >
                        <label for="{{ form.is_default.id_for_label }}" class="flex items-center gap-2">
                            {{ form.is_default }}
                            <span class="text-sm text-zinc-400">Set as default</span>
                        </label>
                    </div>
                </div>

                <input type="hidden" name="lat" id="id_lat">
                <input type="hidden" name="lng" id="id_lng">

                <div class="mt-3">
                    <button type="button" id="get-location-btn" class="flex items-center gap-2 px-4 py-2.5 text-sm font-medium text-green-900 bg-green-50 rounded-xl hover:bg-green-100 transition-colors">
                        <i data-lucide="map-pin" class="size-4"></i>
                        <span id="location-btn-text">Use my current location</span>
                    </button>

                    <p id="location-message" class="mt-2 text-xs text-zinc-500"></p>
                </div>
            </div> 

            <button type="submit" class="mt-6 w-full py-3 bg-green-900 text-white font-semibold rounded-xl hover:bg-green-600 transition-colors cursor-pointer">
                
                {% if isEdit %}
                    Update Address
                {% else %}
                    Save Address
                {% endif %}
                    
            </button>
        </form>
    </div>
</section>

<script>
    const addressForm2 = document.getElementById('address-form');
    
    const clAddressFormBtn = document.getElementById('cl-address-form-btn');
    if(clAddressFormBtn){
        clAddressFormBtn.addEventListener('click',()=>{
            addressForm2.classList.add('hidden');
            sessionStorage.removeItem('showAddressForm');
        })
    }

    const addressFormClnBg = document.getElementById('address-form-cln-bg');
    if(addressFormClnBg){
        addressFormClnBg.addEventListener('click', ()=>{
            addressForm2.classList.add('hidden');
            sessionStorage.removeItem('showAddressForm')
        })
    }

    if (sessionStorage.getItem("showAddressForm") === "true") {
        
        addressForm2.classList.remove("hidden");
        // cartSidebarRight.classList.add('animate-slide-in-right');
    }
    
</script>

<script>
    const getLocationBtn = document.getElementById("get-location-btn");
    const locationBtnText = document.getElementById("location-btn-text");
    const locationMessage = document.getElementById("location-message");

    const latitudeInput = document.getElementById("id_lat");
    const longitudeInput = document.getElementById("id_lng");

    if (getLocationBtn) {
        getLocationBtn.addEventListener("click", () => {

            if (!navigator.geolocation) {
                locationMessage.textContent =
                    "Geolocation is not supported by your browser.";
                return;
            }

            locationBtnText.textContent = "Getting location...";
            locationMessage.textContent = "";

            navigator.geolocation.getCurrentPosition(
                (position) => {

                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    latitudeInput.value = lat;
                    longitudeInput.value = lng;

                    locationBtnText.textContent = "Location detected";
                    locationMessage.textContent = "Your current location has been detected.";

                },

                (error) => {

                    locationBtnText.textContent = "Use my current location";

                    switch (error.code) {
                        case error.PERMISSION_DENIED:
                            locationMessage.textContent = "Location permission was denied.";
                            break;

                        case error.POSITION_UNAVAILABLE:
                            locationMessage.textContent = "Location information is unavailable.";
                            break;

                        case error.TIMEOUT:
                            locationMessage.textContent = "Location request timed out.";
                            break;

                        default:
                            locationMessage.textContent = "Unable to get your location.";
                    }
                }
            );
        });
    }
</script>
