<section>
    <div class="fixed inset-0 bg-black/40 z-50"></div>
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <form action="{% url 'VerifyOtp' %}" method="POST" class="bg-white rounded-2xl p-6 w-full max-w-sm animate-fade-in">
            {% csrf_token %}
            <h3 class="text-lg font-semibold text-green-900 mb-2">Enter Delivery OTP</h3>
            <h5 class="text-sm font-semibold text-green-900 mb-2">Order Id = #{{ orderId|slice:'-6:'|upper }}</h5>

            <input type="hidden" name="order_id" value="{{ orderId }}">
            <p class="text-sm text-zinc-500 mb-5">Ask the customer for the 6-digit OTP shown on their tracking page</p>
            <input type="text" maxlength="6" name="otp" placeholder="000000" class="w-full px-4 py-3 text-center text-2xl font-mono tracking-[0.5em] rounded-xl border border-zinc-400 focus:border-green-900 outline-none mb-4">
            
            <div class="flex gap-2">
                <a href="?otpModal=None" class="flex-1 flex justify-center py-2.5 text-sm font-medium text-zinc-600 bg-zinc-100 rounded-xl hover:bg-zinc-200 transition-colors cursor-pointer">
                    Cancel
                </a>
                <button name="otpSubmit" type="submit" class="flex-1 py-2.5 text-sm font-medium text-white bg-green-600 rounded-xl hover:bg-green-700 transition-colors disabled:opacity-50 cursor-pointer">
                    Verify
                </button>
            </div>
            
        </form>
    </div>
</section>
